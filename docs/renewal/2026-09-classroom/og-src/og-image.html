<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Zen+Kurenaido&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:"Noto Sans JP",sans-serif;color:#14335A;position:relative}
.logo{position:absolute;left:64px;top:52px;height:44px}
.hand{position:absolute;left:70px;top:150px;font-family:"Zen Kurenaido",cursive;font-size:30px;line-height:1.45;color:#2C8FA8;transform:rotate(-8deg);letter-spacing:.06em}
.en{position:absolute;right:64px;top:70px;font-size:13px;font-weight:700;letter-spacing:.3em;color:#6E8199;line-height:1.9;text-align:right}
.wrap{position:absolute;left:0;right:0;top:124px;text-align:center}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:.12em;margin-bottom:14px}
h1{font-size:78px;font-weight:900;line-height:1.1;letter-spacing:-.02em}
h1 .web{color:#2C8FA8;position:relative;display:inline-block}
h1 .web::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:9px;border-radius:9px;background:#FD7368}
.lead{margin-top:18px;font-size:24px;font-weight:700}
.price{margin-top:14px;font-size:22px;font-weight:700}
.price b{font-size:40px;color:#2C8FA8;font-weight:900}
.price .sep{color:#9AA9BC;margin:0 14px}
.town{position:absolute;bottom:0;width:290px}
.town.l{left:0}.town.r{right:0}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#041627}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;background:#FD7368;color:#fff;font-weight:700;font-size:22px;padding:14px 40px;border-radius:999px;white-space:nowrap}
</style></head><body>
<img class="logo" src="logo.png" alt="">
<div class="en">LOCAL BUSINESS,<br>NEXT POSSIBILITIES.</div>
<div class="wrap">
  <div class="eyebrow">埼玉の会社・お店・教室のためのWeb担当</div>
  <h1>あなたは、本業に。<br><span class="web">Web</span>は、私たちに。</h1>
  <div class="lead">ホームページ制作から、公開後の更新・管理まで。</div>
  <div class="price">初期制作費 <b>0円</b><span class="sep">｜</span>月額 <b>8,980円</b>（税込）</div>
</div>
<img class="town l" src="town-left.webp" alt=""><img class="town r" src="town-right.webp" alt="">
<div class="pill">無料でデザイン案を見てみる ↗</div>
<div class="bar"></div>
</body></html>
